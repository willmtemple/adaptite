name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Lets mise's github backend fetch the cop release and verify attestations
  # without hitting unauthenticated GitHub API rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: Lint & docs (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain via mise
        uses: jdx/mise-action@v4
      # mise's rust backend delegates to rustup, whose toolchain lives outside the
      # cached mise dir. On a mise cache hit the component install is skipped and
      # rustup auto-installs a minimal toolchain (no rustfmt/clippy), so install the
      # required components explicitly and idempotently against the pinned toolchain.
      - name: Ensure rust components
        run: mise exec -- bash -c 'rustup toolchain install "$RUSTUP_TOOLCHAIN" -c rustfmt -c clippy -c llvm-tools --no-self-update'
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Debug-only code paths (the divergence guard, the ownership audit registry) leave their
      # helpers unused in an optimized build, so `cfg` mistakes are invisible to the debug lint
      # above. Two real dead-code findings came from this before it was a CI step.
      - name: Clippy (release profile)
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      # Not redundant with the debug test job: the divergence guard, the ownership audit
      # registry and the cross-reactor assert are all `debug_assertions`-gated, so this runs
      # genuinely different code. A test asserting debug-only behaviour shipped broken here
      # once and no job noticed. Reuses the release artifacts the clippy step just built.
      - name: Test (release profile)
        run: cargo test --release --workspace
      # Advisory: an application can only reach the runite minor adaptite
      # declares, so a new runite minor is invisible downstream until adaptite
      # releases against it. Non-blocking because it depends on the network and
      # on runite's release timing, neither of which should red a PR.
      - name: runite minor drift
        continue-on-error: true
        run: mise run runite-current
      # cop is an experimental external analyzer whose `rust` provider can be
      # auto-updated to a version the pinned cop binary cannot load. Keep these
      # steps advisory (non-blocking) so upstream tooling churn never reds CI.
      - name: Cop checks
        continue-on-error: true
        run: cop cop-checks/main.cop -t .
      - name: Cop verify
        continue-on-error: true
        run: cop verify cop-checks/

  test-linux:
    name: Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain via mise
        uses: jdx/mise-action@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      # Every example runs to completion. Beyond keeping the examples honest,
      # this exercises the reactive graph end-to-end on the real runtime.
      - name: Smoke-run examples
        run: mise run examples
      # The benchmarks are the evidence behind the diagnostics cost contract
      # (docs/diagnostics.md), so they must keep building and running. Timings are *not*
      # asserted: see the note on mise's `bench-smoke` task for why a threshold on a shared
      # runner would be worse than no threshold.
      - name: Smoke-run benchmarks
        run: mise run bench-smoke

  # `rust-version` in Cargo.toml is a promise to downstream users, and nothing else in this
  # workflow checks it — the pinned toolchain tracks stable. Without this the MSRV can be broken
  # by a language feature nobody noticed using, and the first report comes from a user.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Block scalar, so YAML does no escaping of its own: the quoting needed to pull a
      # double-quoted TOML value apart does not survive a plain scalar.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install it
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # Build and test rather than clippy: lint output legitimately differs between toolchains,
      # and what downstream cares about is whether the crate compiles and behaves.
      - name: Build
        run: cargo +${{ steps.msrv.outputs.version }} build --workspace --all-targets --locked
      - name: Test
        run: cargo +${{ steps.msrv.outputs.version }} test --workspace --locked

  test-macos:
    name: Test (macOS aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain via mise
        uses: jdx/mise-action@v4
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  test-windows:
    name: Test (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Install only the pinned Rust: the other mise tools (cop) run in the
      # Linux lint job, and skipping them keeps Windows provisioning fast.
      - name: Install toolchain via mise
        uses: jdx/mise-action@v4
        with:
          install_args: rust
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

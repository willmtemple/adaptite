# Reproducible toolchain.
# Install everything with `mise install`, then use `mise run <task>`.
#
# Reproducibility model: the version specs below are intentionally loose
# (track stable). Exact resolved versions + checksums are pinned in `mise.lock`
# (committed), so `mise install` is fully reproducible. To intentionally update
# the toolchain, run `mise upgrade` (bumps within the spec) followed by
# `mise lock`, then commit the refreshed `mise.lock`.

[settings]
# Pin exact versions + checksums in mise.lock instead of hard-coding them here.
lockfile = true

[tools]
# Track stable Rust 1.x; `mise.lock` pins the exact patch release. adaptite is
# stable-Rust clean; edition 2024 requires >= 1.85. Components are declared
# explicitly so a fresh `mise install` (e.g. CI) gets rustfmt + clippy and the
# llvm-tools that cargo-llvm-cov needs — mise's rust backend installs a minimal
# profile otherwise.
rust = { version = "1", components = "rustfmt,clippy,llvm-tools" }

# Agent Cop static-analysis tool, installed from GitHub release binaries; the
# exact release is pinned in `mise.lock`. https://github.com/KrzysztofCwalina/cop
"github:KrzysztofCwalina/cop" = { version = "latest", exe = "cop" }

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace --all-targets"

[tasks.test]
description = "Run all tests including doctests"
run = "cargo test --workspace --all-features"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.doc]
description = "Build documentation, failing on broken links"
# `-D warnings` matches CI. Moving code between modules silently breaks intra-doc links —
# `cargo build` and `cargo test` both pass — so this belongs in the local gate, not only in CI.
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps"

[tasks.bench]
description = "Run criterion benchmarks (runtime + I/O)"
run = "cargo bench --workspace --all-features"

[tasks.coverage]
description = "Generate an HTML + lcov coverage report with cargo-llvm-cov"
run = [
  "cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info",
  "cargo llvm-cov report --html",
]

[tasks.coverage-ci]
description = "Emit lcov coverage for CI consumption"
run = "cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info"

[tasks.examples]
description = "Smoke-run every example to completion"
# mise runs tasks with `sh` by default; dash rejects `pipefail`, so pin bash.
shell = "bash -c"
run = """
set -euo pipefail
for ex in spreadsheet stock_ticker screen_router signal_thunk_showcase \
          tracing_subscriber_showcase idle_audit readme_md_01 readme_md_02 readme_md_03; do
  echo "== example: $ex =="
  cargo run --quiet --example "$ex"
done
"""

[tasks.runite-current]
description = "Check that the declared runite requirement tracks runite's latest minor"
# adaptite must resolve the same runite as the application above it, so a runite
# minor is unreachable to every RUIN application until adaptite releases against
# it (issue #12). This drifted a whole minor unnoticed once; the check makes the
# gap visible instead of waiting for a bug report. Network-dependent, so CI runs
# it advisory-only.
shell = "bash -c"
run = """
set -euo pipefail
declared="$(cargo metadata --format-version 1 --no-deps \
  | grep -o '"name":"runite","source":"[^"]*","req":"[^"]*"' \
  | grep -o '"req":"[^"]*"' | cut -d'"' -f4)"
# The sparse index is newline-delimited JSON in *publication* order and it keeps yanked
# entries, so the last line is the most recently uploaded version, not the highest one. This
# used to read `| tail -1`, which a backported patch to an older minor, a prerelease, or a
# yank each turn into a false failure against a perfectly current dependency. The helper
# filters to stable, unyanked releases and sorts by semver; tests/release_fixes.rs pins it.
latest="$(curl -sSf https://index.crates.io/ru/ni/runite \
  | bash "${MISE_PROJECT_ROOT:-.}/.github/scripts/latest-stable-version.sh")"
echo "declared: ${declared}   latest published: ${latest}"
# Compare minors only: a patch release needs no manifest change.
declared_minor="$(echo "${declared}" | tr -d '^~' | cut -d. -f1,2)"
latest_minor="$(echo "${latest}" | cut -d. -f1,2)"
if [ "${declared_minor}" != "${latest_minor}" ]; then
  echo "error: adaptite declares runite ${declared_minor}, but runite ${latest_minor} is published." >&2
  echo "       Until adaptite releases against it, no application in the tree can reach it." >&2
  exit 1
fi
"""

[tasks.min-versions]
description = "Resolve every direct dependency at its declared floor and build against it"
# A floor in Cargo.toml is a promise that the crate works there, and nothing else checks it:
# normal resolution always takes the *maximum*, so a floor can be years wrong and every gate
# stays green. `tracing = "0.1"` was exactly that -- runite calls `tracing::enabled!`, which
# landed in 0.1.30, so the declared floor named 39 versions the crate cannot build against.
#
# Scope is `--lib` on purpose. `-Z direct-minimal-versions` minimises dev-dependencies too,
# and criterion's and tracing-subscriber's own floors reach ancient proc-macro2 and
# sharded-slab releases that no current rustc compiles. That is an upstream fact about the
# test tooling, and no consumer of adaptite ever resolves it -- dev-dependencies are not part
# of the published dependency graph. `--lib` checks the part that is.
#
# Needs nightly and the network, so this is not part of `check`; CI runs it advisory-only.
shell = "bash -c"
run = '''
set -euo pipefail
root="${MISE_PROJECT_ROOT:-.}"
rustup toolchain install nightly --profile minimal --no-self-update
# generate-lockfile rewrites Cargo.lock in place; put the committed one back on any exit.
backup="$(mktemp)"
cp "${root}/Cargo.lock" "${backup}"
trap 'cp "${backup}" "${root}/Cargo.lock"; rm -f "${backup}"' EXIT
cargo +nightly -Z direct-minimal-versions generate-lockfile
echo "== resolved floors =="
cargo tree --depth 1 --edges normal
cargo +nightly -Z direct-minimal-versions build --lib --locked
'''

[tasks.cop]
description = "Run Agent Cop static-analysis checks"
run = "cop cop-checks/main.cop -t ."

[tasks.cop-verify]
description = "Verify cop rule files compile"
run = "cop verify cop-checks/"

[tasks.test-release]
description = "Run the tests against the optimized profile"
# adaptite genuinely behaves differently there: the divergence guard, the ownership audit
# registry and the cross-reactor assert are all `debug_assertions`-gated, so a release run
# executes different code. A test asserting debug-only behaviour shipped broken here once.
run = "cargo test --release --workspace --all-features"

[tasks.lint-release]
description = "Clippy against the optimized profile, where debug-only paths compile out"
# The debug lint cannot see code that is only dead when `debug_assertions` is off — the
# divergence guard and the ownership audit registry both have that shape.
run = "cargo clippy --release --workspace --all-targets --all-features -- -D warnings"

[tasks.bench-smoke]
description = "Run every benchmark once, to prove they still build and execute"
# Deliberately not a timing gate: both real diagnostics regressions in 0.3 were 9% and 15.7%,
# which is inside the run-to-run variance of a shared CI runner. A threshold loose enough not to
# flake would have caught neither, and a flaky perf gate gets disabled and then protects nothing.
# The A/B procedure in docs/diagnostics.md is the gate; this only stops the benches from rotting.
run = "cargo bench --bench graph -- --warm-up-time 0.1 --measurement-time 0.2 --sample-size 10"

[tasks.check]
description = "Run the full local gate (fmt, lint, lint-release, doc, test, test-release, cop)"
depends = ["fmt", "lint", "lint-release", "doc", "test", "test-release", "cop"]

[tasks.msrv]
description = "Build and test against the MSRV declared in Cargo.toml"
# The version is read from the manifest rather than repeated here, so the two cannot drift.
shell = "bash -c"
run = '''
set -euo pipefail
version="$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)"
echo "declared MSRV: ${version}"
rustup toolchain install "${version}" --profile minimal --no-self-update
cargo "+${version}" build --workspace --all-targets
cargo "+${version}" test --workspace
'''
